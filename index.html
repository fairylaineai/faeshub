<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Faes Hub</title>
<meta name="description" content="Links and projects from fae.">
<meta name="theme-color" content="#1d2418">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path fill='%23c4f53c' d='M50 0l11 39 39 11-39 11-11 39-11-39L0 50l39-11z'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bgart"></div><div class="bgart"></div><div class="wash"></div><div class="stars" id="stars" aria-hidden="true"></div>

<div class="wrap">
  <header class="hero">
    <div class="intro">
      <h1 class="go" style="--i:1">Faes<br>Hub<span class="spark" aria-hidden="true"></span></h1>
      <p class="lead go" style="--i:2">Lesbian that goes <em>bouldering</em>.</p>
    </div>
    <figure class="art go" style="--i:2" id="art">
      <div class="frame" id="frame" role="group" aria-label="Artwork slideshow, click for the next one"></div>
      <figcaption><span>Art by @komiumee</span><span class="dots" id="dots"></span></figcaption>
    </figure>
      <div class="zone">
        <p class="group go" style="--i:3">Find me</p>
        <nav class="list go" style="--i:4" id="links" aria-label="Links"></nav>
        <p class="group go" style="--i:5">Projects</p>
        <nav class="list go" style="--i:6" id="projects" aria-label="Projects"></nav>
      </div>
  </header>

  <section class="sec" id="gallery">
    <h2>Gallery</h2>
    <p class="sub">Art by @komiumee, tap one to see it big.</p>
    <div class="rail" id="rail"></div>
  </section>

  <section class="sec" id="room-sec" hidden>
    <h2>My room</h2>
    <p class="sub">Every glowing label is a link.</p>
    <div class="stage">
      <canvas id="room" width="400" height="250" role="img" aria-label="Pixel art: a cozy hippie room on a rainy night with plants, a bed with mushroom sheets, a desk, a bookshelf and a handpan"></canvas>
      <div class="tags" id="tags"></div>
    </div>
  </section>

  <footer class="foot">
    <span>© <span id="year"></span> fae</span>
    <span>All artwork by @komiumee</span>
    <a href="/__logout">Log out</a>
  </footer>
</div>

<dialog id="lb">
  <img alt="">
  <p>Art by @komiumee</p>
  <button class="nav pv" aria-label="Previous artwork">‹</button>
  <button class="nav nx" aria-label="Next artwork">›</button>
</dialog>

<script src="config.js"></script>
<script src="common.js"></script>
<script>
document.documentElement.classList.add('js');

// Hier eintragen: Symbol, Titel, kurze Zeile, Adresse
const LINKS = [
  {icon:"🎮", title:"Discord", note:"- Currently just Discord Web -", url:"https://discord.com"},
  {icon:"💻", title:"GitHub", note:"Code and bots", url:"https://github.com/fairylaineai"},
  {icon:"🎧", title:"Spotify", note:"What's playing", url:"https://open.spotify.com/user/h1iqv1xh8wfztgury68d4kyml?si=o4SicJtcTQCqEQ-1yMMIfQ&utm_source=copy-link"},
  {icon:"📸", title:"Instagram", note:"Back to Instagram", url:"https://instagram.com"},
];
const PROJECTS = [
  {icon:"➕", title:"Add to your server", note:"FairyCodez: games and a tiny RPG", url:BOT_INVITE, cls:"cta"},
  {icon:"📖", title:"FairyCodez commands", note:"Every command, explained", url:"commands.html", internal:true, id:"cmdlink"},
  {icon:"🐟", title:"fisch.ing", note:"Visit my co-Project Website", url:"https://www.fisch.ing"},
];
// Bilder: Datei im Ordner images/ plus Beschreibung. Die ersten 4 laufen oben als Slideshow.
const ART = [
  {s:"images/art-subway.webp",    a:"Two people sitting close together on a train, one leaning on the other's arm"},
  {s:"images/art-green.webp",     a:"A black-haired person in front, a red-haired person leaning on their shoulder, green stars"},
  {s:"images/art-guitar.webp",    a:"Two people on a bed with a red guitar, band posters and string lights behind them"},
  {s:"images/art-headphones.webp",a:"Two people in a dark green frame, one in headphones and a Radiohead shirt, one in a corset top"},
  {s:"images/art-hug.webp",       a:"Two people hugging tightly, a close-up of their eyes in a panel above"},
  {s:"images/art-iloveyou.webp",  a:"Two people embracing with speech bubbles that say I love you"},
  {s:"images/art-candles.webp",   a:"Two people embracing at a candlelit table in front of a big window"},
];

$('#links').innerHTML=LINKS.map(btn).join('');
$('#projects').innerHTML=PROJECTS.map(btn).join('');
$('#year').textContent=new Date().getFullYear();

// Bot-Status am Befehle-Button
botStatus().then(d=>{const sm=$('#cmdlink small');if(d&&sm)sm.innerHTML=`<span class="dot${d.online?' on':''}"></span>FairyCodez is ${d.online?'online':'asleep'}`});

// Spotify "Now playing": der Spotify-Button zeigt den laufenden Song samt Cover
if(typeof SHOW_NOW_PLAYING==='undefined'||SHOW_NOW_PLAYING){
  const sp=[...document.querySelectorAll('#links .glass')].find(a=>a.querySelector('b').textContent==='Spotify');
  if(sp){const chip=sp.querySelector('.chip'),sm=sp.querySelector('small'),icon=chip.innerHTML,note=sm.textContent;
    const tick=async()=>{if(document.hidden)return;
      try{const r=await fetch('/api/now-playing',{cache:'no-store'});if(!r.ok)return;const d=await r.json();
        if(d.playing){sm.textContent='Now playing: '+d.title+', '+d.artist;if(d.art){chip.style.backgroundImage=`url(${d.art})`;chip.innerHTML=''}}
        else{sm.textContent=note;chip.style.backgroundImage='';chip.innerHTML=icon}}catch(e){}};
    tick();setInterval(tick,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()})}}
// Slideshow oben + weichgezeichneter Hintergrund in den Farben des Bildes
const HERO=ART.slice(0,4),frame=$('#frame'),dots=$('#dots'),bgs=[...document.querySelectorAll('.bgart')];
frame.innerHTML=HERO.map((x,i)=>`<img src="${x.s}" alt="${x.a}" ${i?'loading="lazy"':''} decoding="async">`).join('');
dots.innerHTML=HERO.map((_,i)=>`<button aria-label="Show artwork ${i+1}"></button>`).join('');
const imgs=[...frame.children],db=[...dots.children];
let cur=0,bgi=0,timer,sx=0,swf=0;
function show(i){
  cur=(i+HERO.length)%HERO.length;
  imgs.forEach((m,k)=>m.classList.toggle('on',k===cur));
  db.forEach((d,k)=>d.classList.toggle('on',k===cur));
  const nb=bgs[bgi^1];nb.style.backgroundImage=`url(${HERO[cur].s.replace('images/','images/bg/')})`;nb.classList.add('on');bgs[bgi].classList.remove('on');bgi^=1}
function play(){clearInterval(timer);if(!matchMedia('(prefers-reduced-motion:reduce)').matches)timer=setInterval(()=>show(cur+1),6500)}
db.forEach((d,k)=>d.onclick=()=>{show(k);play()});
frame.onclick=()=>{if(Date.now()-swf<400)return;show(cur+1);play()};
show(0);play();
frame.addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX},{passive:true});
frame.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>45){swf=Date.now();show(cur+(d<0?1:-1));play()}},{passive:true});
document.addEventListener('visibilitychange',()=>{document.hidden?clearInterval(timer):play()});

if(matchMedia('(hover:hover)').matches&&!matchMedia('(prefers-reduced-motion:reduce)').matches){
  const art=$('#art');
  art.addEventListener('pointermove',e=>{const r=frame.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
    frame.style.setProperty('--ry',(x*10)+'deg');frame.style.setProperty('--rx',(-y*10)+'deg')});
  art.addEventListener('pointerleave',()=>{frame.style.setProperty('--rx','0deg');frame.style.setProperty('--ry','0deg')})}

// Galerie + Großansicht
$('#rail').innerHTML=ART.map((x,i)=>`<button data-i="${i}" aria-label="Open artwork ${i+1}"><img src="${x.s.replace('images/','images/thumbs/')}" alt="${x.a}" loading="lazy" decoding="async"></button>`).join('');
const lb=$('#lb'),lbi=lb.querySelector('img');let li=0;
const open=i=>{li=(i+ART.length)%ART.length;lbi.src=ART[li].s;lbi.alt=ART[li].a;if(!lb.open)lb.showModal()};
$('#rail').addEventListener('click',e=>{const b=e.target.closest('button');if(b)open(+b.dataset.i)});
let lx=0,lsw=0;
lb.addEventListener('touchstart',e=>{lx=e.changedTouches[0].clientX},{passive:true});
lb.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-lx;if(Math.abs(d)>45){lsw=Date.now();open(li+(d<0?1:-1))}},{passive:true});
lb.addEventListener('click',e=>{if(Date.now()-lsw<400)return;if(e.target.closest('.nx'))open(li+1);else if(e.target.closest('.pv'))open(li-1);else lb.close()});
addEventListener('keydown',e=>{if(!lb.open)return;if(e.key==='ArrowRight')open(li+1);if(e.key==='ArrowLeft')open(li-1)});

// Zimmer ein-/ausblenden: auf true setzen, dann erscheint der Bereich "My room" wieder
const SHOW_ROOM=false;
if(SHOW_ROOM){$('#room-sec').hidden=false;const rs=document.createElement('script');rs.src='room.js';document.body.appendChild(rs)}

// Zimmer-Beschriftungen: Titel muss zu einem Eintrag oben passen.
// tag = Position des Labels, obj = Kreis um das Objekt (x, y, Radius x, Radius y), alles in Zimmer-Pixeln (400x250)
const SPOTS=[
  {title:"GitHub",    tag:[86,106],  obj:[90,124,16,12]},
  {title:"Instagram", tag:[166,80],  obj:[166,57,22,16]},
  {title:"Discord",   tag:[247,100], obj:[247,113,14,12]},
  {title:"Spotify",   tag:[200,203], obj:[200,172,22,10]},
  {title:"fisch.ing", tag:[322,102], obj:[324,146,22,32]},
];
const ALL=[...LINKS,...PROJECTS],tags=$('#tags');
tags.innerHTML=SPOTS.map(s=>{const l=ALL.find(a=>a.title===s.title);
  return `<a href="${l.url}" target="_blank" rel="noopener" data-t="${s.title}" aria-label="${l.title}: ${l.note}" style="left:${s.tag[0]/4}%;top:${s.tag[1]/2.5}%"><span class="ic" aria-hidden="true">${l.icon}</span>${l.title}</a>`}).join('');
tags.querySelectorAll('a').forEach(a=>{
  const on=()=>window.hot=a.dataset.t,off=()=>window.hot=null;
  a.addEventListener('mouseenter',on);a.addEventListener('focus',on);a.addEventListener('mouseleave',off);a.addEventListener('blur',off)});
</script>
</body>
</html>
